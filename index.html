    <h2>Wild Web Midi</h2>
    <div>
      WildMidi is a wavetable synthesizer that plays and converts midi at pretty good quality. "WildWebMidi" is a port that runs in your browser in JavaScript. Open a midi or pick a sample below.

    <!-- status, spinner, progress, player bar, playlist, etc… -->

    <div>
      <button onclick="startRecording()">Start Recording</button>
      <button onclick="stopRecording()">Download WAV</button>
      <label>
        <input type="checkbox" id="waveconversion" />
        Run WAV Converter (instead of web audio playback)
      </label>

    <div id="completed"></div>

    <script src="web_audio_player.js"></script>
    <script src="wildwebmidi.js" async></script>

    <script>
      // ——————————————————————————————————————————————————
      // Your existing globals
      // ——————————————————————————————————————————————————
      var SAMPLE_RATE = 48000, BUFFER = 4096, channels = 2;
      var audioCtx, scriptNode, circularBuffer, emptyBuffer;
      var recording = false,
          leftBuffers = [],
          rightBuffers = [];

      // Initialize audio context & circular buffer
      function initAudio() {
        audioCtx = new window.AudioContext({ sampleRate: SAMPLE_RATE });
        scriptNode = audioCtx.createScriptProcessor(BUFFER, 0, channels);
        scriptNode.onaudioprocess = onAudioProcess;
        source = audioCtx.createBufferSource();
        circularBuffer = new CircularAudioBuffer(4, audioCtx);
        emptyBuffer = audioCtx.createBuffer(channels, BUFFER, SAMPLE_RATE);
        source.connect(scriptNode);
        source.start(0);
      }

      function onAudioProcess(event) {
        // --- capture for recording ---
        if (recording) {
          var inBuf = event.inputBuffer;
          leftBuffers.push(new Float32Array(inBuf.getChannelData(0)));
          rightBuffers.push(new Float32Array(inBuf.getChannelData(1)));
        }
        // --- existing playback via circularBuffer ---
        var generated = circularBuffer.use();
        if (!generated) generated = emptyBuffer;
        event.outputBuffer.copyToChannel(generated.getChannelData(0), 0);
        event.outputBuffer.copyToChannel(generated.getChannelData(1), 1);
      }

      function startRecording() {
        if (!audioCtx) initAudio();
        leftBuffers = [];
        rightBuffers = [];
        recording = true;
        // ensure scriptNode is live
        scriptNode.connect(audioCtx.destination);
      }

      function stopRecording() {
        recording = false;
        scriptNode.disconnect();
        // merge, interleave, encode, and download
        var left  = flattenArray(leftBuffers);
        var right = flattenArray(rightBuffers);
        var interleaved = interleave(left, right);
        var wavView = encodeWAV(interleaved, channels, SAMPLE_RATE);
        var blob = new Blob([wavView], { type: 'audio/wav' });
        var url  = URL.createObjectURL(blob);
        var a    = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = 'recording_48k.wav';
        document.body.appendChild(a);
        a.click();
        URL.revokeObjectURL(url);
      }

      function flattenArray(buffers) {
        var length = buffers.reduce((sum, b) => sum + b.length, 0);
        var result = new Float32Array(length);
        var offset = 0;
        buffers.forEach(b => {
          result.set(b, offset);
          offset += b.length;
        });
        return result;
      }
